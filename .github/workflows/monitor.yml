name: monitor-duo
on:
  schedule: [{ cron: '*/10 * * * *' }]   # respaldo por si se corta la cadena
  workflow_dispatch:
env:
  END_EPOCH: '1795129200'   # jueves 19 nov 2026, 6:00 pm hora de Orlando (23:00 UTC)
permissions:
  contents: write
  actions: write
concurrency:
  group: monitor-duo
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Revisar cada 90 s durante ~45 min
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          # fuera de la ventana (despues del 19 nov en Orlando) no hay nada que revisar: no gastar minutos
          if [ "$(date -u +%s)" -ge "$END_EPOCH" ]; then echo 'ventana terminada'; exit 0; fi
          n=0
          while [ "$SECONDS" -lt 2700 ] && [ "$(date -u +%s)" -lt "$END_EPOCH" ]; do
            n=$((n+1))
            node monitor.mjs && rc=0 || rc=$?
            if [ "$rc" -eq 75 ]; then echo "relanzando en otro servidor"; break; fi
            if [ "$rc" -ne 0 ]; then echo "revision $n fallo"; fi
            # alinea al reloj: A revisa en los segundos 0,45,90... y B en 22,67,...; juntas cubren cada ~22 s sin pasar de 1 peticion/45 s por IP
            sleep $(( (0 - $(date +%s) % 45 + 45) % 45 ))
          done
      - name: Guardar estado
        run: |
          git config user.name monitor && git config user.email monitor@users.noreply.github.com
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -q -m "estado"
            for i in 1 2 3 4 5; do
              git pull -q --rebase -X theirs && git push -q && break
              sleep $((RANDOM % 5 + 2))
            done
          fi
      - name: Relanzar la cadena (hasta el jueves 19 nov, 6 pm Orlando)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%s)" -lt "$END_EPOCH" ]; then gh workflow run monitor-duo --ref main; fi
