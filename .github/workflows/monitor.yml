name: monitor-duo
on:
  schedule: [{ cron: '*/5 * * * *' }]
  workflow_dispatch:
permissions:
  contents: write
concurrency: monitor-duo
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node monitor.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Guardar estado
        run: |
          git config user.name monitor && git config user.email monitor@users.noreply.github.com
          git add state.json && (git diff --cached --quiet || (git commit -m "estado" && git push))
