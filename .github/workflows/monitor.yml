name: monitor-duo
on:
  schedule: [{ cron: '*/10 * * * *' }]   # respaldo por si se corta la cadena
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: monitor-duo
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Revisar cada 90 s durante ~45 min
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          n=0
          while [ "$SECONDS" -lt 2700 ]; do
            n=$((n+1))
            node monitor.mjs || echo "revision $n fallo"
            sleep 20
          done
      - name: Guardar estado
        run: |
          git config user.name monitor && git config user.email monitor@users.noreply.github.com
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -q -m "estado"
            git pull -q --rebase -X theirs
            git push
          fi
      - name: Relanzar la cadena (hasta el 20 nov)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%Y%m%d)" -lt 20261121 ]; then gh workflow run monitor-duo --ref main; fi
